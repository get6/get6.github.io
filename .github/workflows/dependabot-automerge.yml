name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # patch/minor만 자동 머지. main에 required checks가 없어서
      # `gh pr merge --auto`는 lockfile CI를 기다리지 않고 바로 머지한다.
      # 이 job 자신을 --watch 하면 deadlock이므로 lockfile 체크만 폴링한다.
      - name: Wait for lockfile CI and squash-merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            json=$(gh pr checks "$PR_NUMBER" --json name,bucket,workflow)
            bucket=$(
              printf '%s\n' "$json" | jq -r '
                [.[] | select(.name == "lockfile")]
                | if length == 0 then ""
                  elif any(.bucket == "fail") then "fail"
                  elif any(.bucket == "pending") then "pending"
                  elif all(.bucket == "pass" or .bucket == "skipping") then "pass"
                  else "pending"
                  end
              '
            )
            case "$bucket" in
              pass)
                gh pr merge --squash "$PR_URL"
                exit 0
                ;;
              fail)
                echo "lockfile CI failed; refusing to merge"
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          echo "timed out waiting for lockfile CI"
          exit 1

